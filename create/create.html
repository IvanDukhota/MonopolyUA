<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Monopoly - Main Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="create.css" />
</head>

<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo"><a href="../main page/main.html">Monopoly</a></div>
            <nav>
                <ul class="nav-list">
                    <li><a href="../main page/main.html#rulesSection">Rules</a></li>
                    <li><a href="../market/market.html">Market</a></li>
                    <li><a href="../create/create.html">Create/find game</a></li>
                </ul>
            </nav>
            <a class="login-btn"></a>
        </div>
    </header>

    <div class="main-block">

        <div class="create-game">

            <div class="create-game-info">
                <h1>Create your own lobby</h1>
            </div>

            <div class="create-game-settings">

            </div>

            <div class="create-game-button">
                <button>Create</button>
            </div>
        </div>

        <div class="rating-system">

            <div class="rating-system-info">
                <h1>Find rating game</h1>
            </div>

            <div class="rating-system-data"></div>

            <div class="rating-system-button">
                <button>Start</button>
            </div>

        </div>

        <div class="games-list">

            <div class="games-list-info">
                <h1>Games list</h1>
            </div>

            <div class="games-list-view"></div>
        </div>

    </div>























    <div id="sidebar" class="sidebar">
        <div class="sidebar-content">
            <button id="closeSidebar" class="close-sidebar">&times;</button>

            <a href="../profile/profile.html" class="profile-btn">Go to profile</a>

            <h3>Your current money: 100</h3>
            <div class="notifications-title">
                <h4>Notifications</h4>
            </div>
            <div class="notifications">
                <div class="notification-section">
                    <h4>New Messages</h4>
                    <p>You have 3 unread messages.</p>
                </div>
                <div class="notification-section">
                    <h4>Game Updates</h4>
                    <p>Your game stats have been updated!</p>
                </div>
                <div class="notification-section">
                    <h4>System Alerts</h4>
                    <p>Your account has been verified.</p>
                </div>
            </div>
        </div>
    </div>


</body>


<script src="create.js"></script>
